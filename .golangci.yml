# yaml-language-server: $schema=https://raw.githubusercontent.com/golangci/golangci-lint/ca9cb19a64550c6680d1e6fca74b44028ecc4d93/.golangci.reference.yml

version: "2"

linters:
  default: standard

  enable:
    - gosec
    - gocritic
    - bodyclose
    - nilerr
    - reassign
    - copyloopvar
    - unconvert
    - wastedassign
    - errname
    - errorlint
    - misspell
    - goconst

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - bodyclose
          - goconst

  settings:
    gosec:
      excludes:
        - G104
        - G301
        - G302
        - G306
        - G404
      confidence: medium
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - hugeParam
        - rangeValCopy

issues:
  max-issues-per-linter: 50
  max-same-issues: 5
